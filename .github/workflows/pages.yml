name: pages
# Serves docs/ (the paper-trading dashboard) from GitHub Pages.
# The page itself polls the live ledger from raw.githubusercontent.com, so this
# workflow only needs to republish when the HTML changes — not on every state push.

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/.nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
